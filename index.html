<!doctype html>
<html lang="pt-BR" data-palette="classico" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Organizador</title>
  <meta name="description" content="Organizador pessoal: agenda, faculdade, trabalho, hábitos e metas.">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica o tema antes da primeira pintura (evita piscar).
    try {
      var t = JSON.parse(localStorage.getItem('organizador:tema') || '{}');
      var d = document.documentElement;
      d.dataset.palette = t.palette || 'classico';
      d.dataset.mode = t.mode === 'dark' || (t.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      if (t.accent) d.style.setProperty('--accent', t.accent);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand" id="brand"></div>
      <button class="btn btn-primary btn-block" data-action="quick-new">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Novo
      </button>
      <nav class="nav" id="nav" aria-label="Seções"></nav>
      <div class="sidebar-foot" id="account"></div>
    </aside>

    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div id="view"><p class="empty">Carregando…</p></div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
  <button class="fab" data-action="quick-new" aria-label="Criar novo">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="auth" id="auth" hidden></div>
  <div class="backdrop" id="modal" hidden></div>
  <div class="backdrop dialog-layer" id="dialog" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript>Este organizador precisa de JavaScript ativado.</noscript>

  <!-- Ordem importa: núcleo → banco → interface → contas → telas → app -->
  <script src="js/core.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/semana.js"></script>
  <script src="js/faculdade.js"></script>
  <script src="js/importar.js"></script>
  <script src="js/trabalho.js"></script>
  <script src="js/habitos.js"></script>
  <script src="js/metas.js"></script>
  <script src="js/hoje.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
